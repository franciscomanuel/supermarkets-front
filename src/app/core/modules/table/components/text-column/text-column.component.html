<ng-container [matColumnDef]="name">
  <th *matHeaderCellDef mat-header-cell class="text-base font-bold">
    <span [innerHTML]="title"></span>
  </th>
  <td mat-cell *matCellDef="let row; let i = index; let dataIndex = dataIndex">
    @if (row[name] !== null && row[name] !== "") {
    {{ row[name] }}
    } @else { N/A }
  </td>
</ng-container>
