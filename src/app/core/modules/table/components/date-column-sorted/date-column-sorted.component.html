<ng-container [matColumnDef]="name">
  <th *matHeaderCellDef mat-header-cell mat-sort-header class="text-base font-bold">
    <span [innerHTML]="title"></span>
  </th>
  <td mat-cell *matCellDef="let row; let i = index; let dataIndex = dataIndex">
    @if (row[name] !== null && row[name] !== "") {
      {{ row[name] | date: (pattern ? pattern : "dd-MM-yyyy HH:mm:ss") }}
    } @else {
      N/A
    }
  </td>
</ng-container>
