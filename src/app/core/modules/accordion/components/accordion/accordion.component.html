<mat-accordion
  [multi]="multi"
  [hideToggle]="hideToggle"
  [togglePosition]="togglePosition"
>
  <ng-content></ng-content>

  <mat-action-row>
    <button mat-button (click)="onPrevStep()">Previous</button>
    <button mat-button (click)="onNextStep()">End</button>
  </mat-action-row>
</mat-accordion>
