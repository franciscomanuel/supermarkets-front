@switch (type) {
  @case ("basic") {
    <horus-basic-button [text]="text" [disabled]="disabled" [icon]="icon" [link]="link" [tooltip]="tooltip" />
  }
  @case ("raised") {
    <horus-raised-button [text]="text" [disabled]="disabled" [icon]="icon" [link]="link" [tooltip]="tooltip" />
  }
  @case ("stroked") {
    <horus-stroked-button [text]="text" [disabled]="disabled" [icon]="icon" [link]="link" [tooltip]="tooltip" />
  }
  @case ("flat") {
    <horus-flat-button [text]="text" [disabled]="disabled" [icon]="icon" [link]="link" [tooltip]="tooltip" />
  }
  @case ("icon") {
    <horus-icon-button [disabled]="disabled" [icon]="icon" [link]="link" [tooltip]="tooltip"></horus-icon-button>
  }
  @case ("fab") {
    <horus-fab-button [disabled]="disabled" [icon]="icon" [link]="link" [tooltip]="tooltip" />
  }
  @case ("mini-fab") {
    <horus-mini-fab-button [disabled]="disabled" [icon]="icon" [link]="link" [tooltip]="tooltip" />
  }
  @case ("extended-fab") {
    <horus-extended-fab-button [text]="text" [disabled]="disabled" [icon]="icon" [link]="link" [tooltip]="tooltip" />
  }
  @default {
    <horus-basic-button [text]="text" [disabled]="disabled" [icon]="icon" [link]="link" [tooltip]="tooltip" />
  }
}
