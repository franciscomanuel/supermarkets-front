@if (!!link) {
  <a mat-icon-button target="_blank" [disabled]="disabled" [matTooltip]="tooltip" [href]="link">
    <mat-icon [fontIcon]="icon"></mat-icon>
  </a>
} @else {
  <button mat-icon-button [disabled]="disabled" [matTooltip]="tooltip">
    <mat-icon [fontIcon]="icon"></mat-icon>
  </button>
}
