@if (!!link) {
<a
  mat-icon-button
  target="_blank"
  [color]="color"
  [disabled]="disabled"
  [matTooltip]="tooltip"
  [href]="link"
>
  <mat-icon [fontIcon]="icon"></mat-icon>
</a>
} @else {
<button
  mat-icon-button
  [color]="color"
  [disabled]="disabled"
  [matTooltip]="tooltip"
>
  <mat-icon [fontIcon]="icon"></mat-icon>
</button>
}
