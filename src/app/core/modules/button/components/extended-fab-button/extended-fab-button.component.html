@if (!!link) {
  <a mat-fab extended target="_blank" [disabled]="disabled" [matTooltip]="tooltip" [href]="link">
    <mat-icon [fontIcon]="icon"></mat-icon>
    {{ text }}
  </a>
} @else {
  <button mat-fab extended [disabled]="disabled" [matTooltip]="tooltip">
    <mat-icon [fontIcon]="icon"></mat-icon>
    {{ text }}
  </button>
}
