<mat-sidenav-container autosize class="flex-container">
  <mat-sidenav
    #sidenav
    mode="side"
    opened="true"
    class="sidenav"
    [opened]="applicationService.getExpanded()"
  >
    <mat-nav-list>
      @for (option of menuSidenav; track option.title) {
      <mat-list-item [routerLink]="option.link" routerLinkActive="active">
        <span class="flex">
          <mat-icon
            mat-list-icon
            class="pe-2"
            color="primary"
            [fontIcon]="option.icon"
          ></mat-icon>
          <span class="pl-2">{{ option.title }}</span>
        </span>
      </mat-list-item>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="main-layout-route">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
